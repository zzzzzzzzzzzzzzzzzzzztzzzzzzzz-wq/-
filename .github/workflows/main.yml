name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android
          for i in 1 2 3; do
            ./gradlew assembleDebug --refresh-dependencies && break
            echo "attempt $i failed, retrying"
            sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mawaqit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
