name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Add exercise photos (free-exercise-db, public domain)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/yuhonas/free-exercise-db /tmp/fed
          mkdir -p www/img
          for d in Shoulder_Circles Arm_Circles Standing_Hip_Circles Bodyweight_Squat Pushups Plank Bodyweight_Walking_Lunge Freehand_Jump_Squat Push-Up_Wide Butt_Lift_Bridge Side_Bridge Flat_Bench_Lying_Leg_Raise Rope_Jumping Side_Neck_Stretch Chest_And_Front_Of_Shoulder_Stretch Childs_Pose All_Fours_Quad_Stretch Seated_Floor_Hamstring_Stretch Calf_Stretch_Hands_Against_Wall; do
            cp -r "/tmp/fed/exercises/$d" "www/img/$d" || true
          done
      - run: npm install
      - run: npx cap add android
      - name: Add adhan sounds
        run: |
          mkdir -p www/sounds android/app/src/main/res/raw
          echo "[" > www/sounds/list.json
          first=1
          if [ -d sounds ]; then
            for f in sounds/*; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              ext=$(echo "${b##*.}" | tr 'A-Z' 'a-z')
              case "$ext" in mp3|wav|ogg) ;; *) continue ;; esac
              name=$(echo "${b%.*}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/_/g')
              name="s_$name"
              cp "$f" "www/sounds/$name.$ext"
              cp "$f" "android/app/src/main/res/raw/$name.$ext"
              if [ $first -eq 0 ]; then echo "," >> www/sounds/list.json; fi
              echo "\"$name.$ext\"" >> www/sounds/list.json
              first=0
            done
          fi
          echo "]" >> www/sounds/list.json
          cat www/sounds/list.json
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android
          for i in 1 2 3; do
            ./gradlew assembleDebug --refresh-dependencies && break
            echo "attempt $i failed, retrying"
            sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mawaqit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
